[package]
name = "edgeflag-zero-overhead"
version = "0.1.0"
edition = "2024"
description = "Zero-Overhead Abstractions, In-Process SDK Guards, and Multi-Language FFI Contracts for EdgeFlag"
license = "MIT"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh64"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
semver = { version = "1.0", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "rt"], optional = true }

[features]
default = ["std"]
std = []
async-rt = ["dep:tokio"]

[lib]
name = "edgeflag_zero_overhead"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
