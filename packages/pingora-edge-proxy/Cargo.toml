[package]
name = "pingora-edge-proxy"
version = "0.1.0"
edition = "2024"
description = "High-throughput edge proxy layer with TinyUFO caching and token-bucket rate limiting"
license = "MIT OR Apache-2.0"

[dependencies]
TinyUFO = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
