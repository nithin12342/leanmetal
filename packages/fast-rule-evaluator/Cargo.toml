[package]
name = "fast-rule-evaluator"
version = "0.1.0"
edition = "2024"
description = "Deterministic xxHash64 rollout bucketing and multi-clause contextual rule evaluation"
license = "MIT OR Apache-2.0"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh64"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }
